name: Pre-device verification

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

concurrency:
  group: pre-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests and four simulator builds
        run: ./Scripts/verify.sh
